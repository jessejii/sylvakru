name: Release Android

on:
  push:
    # pubspec.yaml 改了 → 自动建/复用 tag → 发布
    branches: [main]
    paths: ['pubspec.yaml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get

      # pubspec.yaml 改了 main → 自动按 version 建 tag v<x.y.z>，已存在则直接 checkout。
      # 老的 "git push origin vx.y.z" 触发依然兼容（tags 触发的路径里这里只会走 exists 分支）。
      - name: Auto-tag
        id: ver
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')
          NAME=$(echo "$VER" | cut -d+ -f1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          git fetch --tags
          TAG="v$NAME"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists"
            git checkout "$TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # 签名密钥（可选）。在仓库 Settings → Secrets 配置：
      #   ANDROID_KEYSTORE_BASE64   = base64 -w0 android/sylvakru-release.jks
      #   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS
      # 未配置时回退到 debug 签名，构建产物可安装但不可上架。
      - name: Prepare signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/sylvakru-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../sylvakru-release.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - run: flutter build apk --release --split-per-abi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
